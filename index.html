<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b120a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BEER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="scene"></canvas>

  <div id="topbar">
    <button id="fb-btn" type="button">Feedback</button>
    <div id="drink-nav">
      <button id="prev" type="button" aria-label="Previous drink">&lsaquo;</button>
      <div>
        <div id="drink-name"></div>
        <div id="dots" aria-hidden="true"></div>
      </div>
      <button id="next" type="button" aria-label="Next drink">&rsaquo;</button>
    </div>
    <div id="count"></div>
  </div>

  <div id="message" hidden></div>
  <div id="actions" role="group" aria-label="Add to your drink" hidden></div>

  <label id="sim" hidden>
    Tilt <input id="sim-tilt" type="range" min="-180" max="180" value="0">
  </label>

  <div id="start">
    <h1 id="title">BEER</h1>
    <p>Swipe to change drinks. Hold your phone like a glass, screen facing out, and tip the top edge to your lips.</p>
    <button id="start-btn" type="button">Pour one</button>
  </div>

  <form id="feedback" hidden>
    <h2>Feedback</h2>
    <textarea id="fb-text" rows="5" placeholder="What looked or felt wrong? What would make it more real?" required></textarea>
    <p id="fb-note">Opens GitHub with your note, plus the drink, your screen size, browser and frame rate.</p>
    <div class="row">
      <button id="fb-cancel" type="button">Cancel</button>
      <button id="fb-send" type="submit">Send</button>
    </div>
  </form>

  <script src="gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
